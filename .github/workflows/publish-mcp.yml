name: Publish MCP Server

# Called by release-please.yml once it has cut the tag and the GitHub release.
# It is no longer triggered by a tag push: release-please creates the tag with
# GITHUB_TOKEN, and tags pushed by that token do not start workflow runs, so a
# `push: tags` trigger here would never fire. workflow_dispatch stays for
# publishing by hand if a release ever needs re-shipping.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    uses: ./.github/workflows/build-and-test.yml
    with:
      check-version: true

  verify-build:
    runs-on: windows-latest
    needs: build-and-test

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ needs.build-and-test.outputs.artifact-name }}
        path: dist/

    - name: List downloaded artifacts
      run: |
        Write-Host "Downloaded artifacts:"
        Get-ChildItem -Path "dist/" -Recurse | Format-Table Name, Length, LastWriteTime

  # Trusted Publishing: PyPI accepts a short-lived OIDC token minted for this
  # job, so there is no long-lived API token to steal. The PyPI project's trusted
  # publisher entries must name this repository, the `pypi` environment, and the
  # *top-level* workflow - release-please.yml for releases, publish-mcp.yml for a
  # manual run - because PyPI matches the caller of a reusable workflow.
  publish-pypi:
    runs-on: ubuntu-latest
    needs: build-and-test
    environment:
      name: pypi
      url: https://pypi.org/project/mcp-windbg/
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ needs.build-and-test.outputs.artifact-name }}
        path: dist/

    - name: List downloaded artifacts
      run: |
        echo "Downloaded artifacts:"
        ls -la dist/

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        version: "0.13.6"   # pinned; bump deliberately, Dependabot does not
        enable-cache: false  # No cache needed for publish-only job

    - name: Publish to PyPI
      run: uv publish --trusted-publishing always

    - name: Create GitHub Release Summary
      run: |
        echo "## 🎉 Package Published Successfully!" >> $GITHUB_STEP_SUMMARY
        echo "📦 Published to **PyPI**: https://pypi.org/project/mcp-windbg/" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Installation" >> $GITHUB_STEP_SUMMARY
        echo '```bash' >> $GITHUB_STEP_SUMMARY
        echo 'pip install mcp-windbg' >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
